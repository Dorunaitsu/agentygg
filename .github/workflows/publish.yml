name: publish

# Publishes the client to PyPI (https://pypi.org/project/agentygg/) when a tag vX.Y.Z is pushed.
# No token anywhere: PyPI trusts this workflow, in this repo, under the `pypi` environment
# (trusted publishing), and each file gets a signed attestation of where it was built.
on:
  push:
    tags: ["v*"]

# Read-only by default; a job that needs more says so (publish: id-token, nothing else).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: The tag is the client's version
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, pyproject $want"; exit 1; }
      - name: Unit tests
        run: uv run --python 3.12 pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: client/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
