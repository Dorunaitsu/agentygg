name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; a job that needs more says so (publish: id-token, nothing else).
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client  # the universal client; plugins/ and hermes-plugin/ sit beside it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Unit tests
        run: uv run --python 3.12 pytest -q
      - name: Install the client like a user
        run: uv tool install --python 3.12 .
      - name: Put uv tools on PATH (unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Put uv tools on PATH (windows)
        if: runner.os == 'Windows'
        run: echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: systemd user session (linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sleep 2
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: CLI works
        run: |
          ygg --version
          ygg relay --help
      - name: Real background relay (Task Scheduler / systemd / launchd)
        run: uv run --python 3.12 python scripts/smoke_service.py
        env:
          PYTHONIOENCODING: utf-8

  hermes-plugin:
    # The Hermes plugin's own tests (Hermes stand-ins in its conftest), with the client's test deps.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Unit tests
        run: uv run --project ../client --python 3.12 pytest -q -o asyncio_mode=auto -p no:cacheprovider tests

  hermes-plugin-experimental:
    # The Hermes plugin that runs ahead of Hermes releases (plugins/hermes), same stand-ins.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/hermes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Unit tests
        run: uv run --project ../../client --python 3.12 pytest -q -o asyncio_mode=auto -p no:cacheprovider tests
