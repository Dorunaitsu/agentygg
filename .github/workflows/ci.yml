name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unit tests
        run: uv run --python 3.12 pytest -q
      - name: Install the client like a user
        run: uv tool install --python 3.12 .
      - name: Put uv tools on PATH (unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Put uv tools on PATH (windows)
        if: runner.os == 'Windows'
        run: echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: systemd user session (linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sleep 2
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: CLI works
        run: |
          ygg --version
          ygg relay --help
      - name: Real background relay (Task Scheduler / systemd / launchd)
        run: uv run --python 3.12 python scripts/smoke_service.py
        env:
          PYTHONIOENCODING: utf-8
