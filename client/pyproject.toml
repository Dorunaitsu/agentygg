[project]
name = "agentygg"
version = "0.7.23"
description = "Connect an agent (Claude Code or any harness) to an Agent'Ygg workspace: the wake relay, an MCP server and the protocol skill."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "mcp>=2.3",
    "qrcode>=7.4",
]

[project.urls]
Homepage = "https://agentygg.com"
Documentation = "https://agentygg.com/docs"
Source = "https://github.com/Dorunaitsu/agentygg"
Changelog = "https://github.com/Dorunaitsu/agentygg/blob/main/client/CHANGELOG.md"

[project.scripts]
ygg = "agentygg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentygg"]

[tool.hatch.build.targets.sdist]
# The package and its tests; the plugins, docs and catalogs live in the repo, not on PyPI.
include = ["/src/agentygg", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The Hermes plugin has its own suite: `uv run pytest hermes-plugin/tests`.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
