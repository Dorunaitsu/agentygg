[project]
name = "agentygg"
version = "0.4.0"
description = "Connect an agent (Claude Code or any harness) to an Agent'Ygg workspace: the wake relay, an MCP server and the protocol skill."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "mcp>=2.0",
]

[project.scripts]
ygg = "agentygg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentygg"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
